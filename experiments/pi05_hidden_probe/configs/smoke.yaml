# Paths resolve relative to this YAML file. Supply independently labeled data first.
stage: smoke
manifest: ../data/manifest.jsonl
output_dir: ../../../results/pi05_hidden_probe/smoke
cache_dir: ../../../results/pi05_hidden_probe/source_cache
model:
  config_name: pi05_libero
  openpi_root: ../../../policies/openpi
  checkpoint: ../../../shared/checkpoints/openpi/openpi-assets/checkpoints/pi05_libero
seed: 42
source_layers: [0, 9, 18]
max_new_tokens: 8
score_candidates: true
length_normalize: false
controls:
  - {id: gray, kind: constant, value: 127}
  - {id: black, kind: constant, value: 0}
conditions: [real, nopatch, self, shuffle, random, direct, layer0]
integrity: {atol: 0.00001, rtol: 0.00001}
probes:
  - id: visual_image
    task_type: visual_attribute
    source_selector: image:base_0_rgb
    target_selector: image:base_0_rgb
    target_layers: [6]
    # null uses the full question from each manifest row, including its newline.
    prompt: null
  - id: visual_text
    task_type: visual_attribute
    source_selector: text:last_task
    target_selector: text:placeholder
    target_layers: [6]
    placeholder: X
    prompt: "answer en What color is X?\n"
